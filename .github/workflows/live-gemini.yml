name: Live Gemini

on:
  workflow_dispatch:

jobs:
  live_gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Live tests (Gemini)
        env:
          RUN_LIVE_GEMINI_TESTS: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm run test:live
